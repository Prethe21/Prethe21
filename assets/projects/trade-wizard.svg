<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="100%" height="44" role="img" aria-label="Trade Wizard: ML-Backed Trade Value Forecasting">
<defs>
<linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1a1140"/>
<stop offset="55%" stop-color="#3d1f7a"/>
<stop offset="100%" stop-color="#1a3a8f"/>
</linearGradient>
<linearGradient id="sh3" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="c3"><rect x="0" y="0" width="880" height="44" rx="9"/></clipPath>
<style>
.shimmer3 { animation: shimmer3 23s ease-in-out infinite; }
@keyframes shimmer3 {
  0% { transform: translateX(-880px); }
  60% { transform: translateX(880px); }
  100% { transform: translateX(880px); }
}
</style>
