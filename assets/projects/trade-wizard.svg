<g clip-path="url(#c3)">
<rect x="0" y="0" width="880" height="44" fill="url(#g3)"/>
<rect x="0" y="0" width="880" height="44" stroke="#6D28D9" stroke-opacity="0.5" fill="none"/>
<g class="shimmer3">
<rect x="-40" y="0" width="100" height="44" fill="url(#sh3)" transform="skewX(-20)"/>
</g>
<text x="22" y="27.5" font-family="Verdana, Geneva, sans-serif" font-size="15" font-weight="700" fill="#F2EFFF">📈&#160;&#160;Trade Wizard: ML-Backed Trade Value Forecasting</text>
</g>
</svg>